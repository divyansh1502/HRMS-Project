<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="login-page min-vh-100 d-flex align-items-center py-4 py-md-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <div class="card border-0 rounded-5 overflow-hidden shadow-lg">
                    <div class="row g-0">
                        <div class="col-lg-5 login-hero text-white p-4 p-md-5 d-flex flex-column justify-content-center">
                            <div class="bg-white bg-opacity-25 rounded-4 d-inline-flex align-items-center justify-content-center mb-4 hero-icon shadow-sm">
                                <i class="fa-solid fa-shield text-white fs-1"></i>
                            </div>
                            <h1 class="display-6 fw-semibold mb-3">Welcome to Admin Login </h1>
                            <p class="lead mb-4 text-white-75 hero-copy">
                                Sign in to manage your workspace, track your team and stay on top of everything that matters.
                            </p>

                            <div class="d-grid gap-3">
                                <div class="d-flex align-items-center gap-3 fw-semibold text-white-90">
                                    <i class="fa-solid fa-circle-check text-white fs-5"></i>
                                    <span>Secured role-based access</span>
                                </div>
                                <div class="d-flex align-items-center gap-3 fw-semibold text-white-90">
                                    <i class="fa-solid fa-circle-check text-white fs-5"></i>
                                    <span>Built for admins & employees</span>
                                </div>
                                <div class="d-flex align-items-center gap-3 fw-semibold text-white-90">
                                    <i class="fa-solid fa-circle-check text-white fs-5"></i>
                                    <span>Fast, reliable, always available</span>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-7 bg-white p-4 p-md-5 d-flex align-items-center">
                            <div class="w-100">
                                <div class="mb-4">
                                    <h2 class="fw-bold mb-2">Admin Login</h2>
                                    <div th:if="${msg}">
                                    <p th:text="${msg}" style="color:red;"></p> 
                                    </div>
                                    <p class="text-muted mb-0">Enter your credentials to continue.</p>
                                </div>

                                <form th:object="${aidto}" method="post">
                                    <div class="mb-3">
                                        <label for="userId" class="form-label fw-semibold">Email ID</label>
                                        <div class="input-group input-group-lg login-field">
                                            <span class="input-group-text bg-light border-end-0">
                                                <i class="fa-solid fa-user text-secondary"></i>
                                            </span>
                                            <input type="text" th:field="${aidto.adminid}" class="form-control bg-light border-start-0"  id="useremail" placeholder="Enter User Email">
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-semibold">Password</label>
                                        <div class="input-group input-group-lg login-field">
                                            <span class="input-group-text bg-light border-end-0">
                                                <i class="fa-solid fa-lock text-secondary"></i>
                                            </span>
                                            <input type="password" th:field="${aidto.password}" class="form-control bg-light border-start-0" id="password" placeholder="Enter Password">
                                        </div>
                                    </div>
                                 <!--  
                                    <div class="mb-4">
                                        <label for="userType" class="form-label fw-semibold">User Type</label>
                                        <select class="form-select form-select-lg bg-light login-field" id="userType">
                                            <option selected>Select User Type</option>
                                            <option value="admin">Admin</option>
                                            <option value="employee">Employee</option>
                                            <option value="manager">Manager</option>
                                        </select>
                                    </div>  -->
     
                                    <button type="submit" class="btn btn-lg w-100 text-white fw-bold rounded-4 login-btn">
                                        Login
                                        <i class="fa-solid fa-arrow-right ms-2"></i>
                                    </button>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script type="text/javascript" src="js/bootstrap.bundle.js"></script>
</body>
</html>
