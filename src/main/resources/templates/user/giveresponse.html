<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
 <main>
    <section class="container my-4">
        <div class="employee-banner">
            <div class="row align-items-center">
                <div class="col-lg-7">
                    <div class="d-flex align-items-center">
                        <div class="banner-icon"><i class="fa-solid fa-comments"></i></div>
                        <div class="ms-3">
                            <h1 class="fw-bold text-white mb-1">Submit Feedback / Complaint</h1>
                            <p class="text-white mb-0 opacity-75">Share your feedback or complaint with our HR team and help us improve.</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5 text-lg-end mt-4 mt-lg-0">
                    <a href="index.html" class="btn btn-light px-4 py-3 rounded-4 fw-semibold add-btn"><i class="fa-solid fa-arrow-left me-2"></i>Back to Home</a>
                </div>
            </div>
        </div>
    </section>

    <section class="container mb-5">
        <div class="table-card response-card mx-auto" style="max-width:840px;">
            <div class="d-flex align-items-center mb-4">
                <i class="fa-solid fa-envelope-circle-check fs-2 me-3 text-dark"></i>
                <h2 class="fw-bold mb-0">Submit Your Response</h2>
            </div>

            <form class="form-group" method="post" th:object="${rdto}">
                <div th:if="${msg}" class="alert alert-success text-center" role="alert">
                    <p th:text="${msg}" class="mb-0"></p>
                </div>

                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Select Response Type</label>
                        <select class="form-control" th:field="${rdto.responsetype}">
                            <option value="feedback">Feedback</option>
                            <option value="complaint">Complaint</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Enter Subject</label>
                        <input type="text" th:field="${rdto.subject}" class="form-control" required />
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Enter Message</label>
                        <textarea th:field="${rdto.responsetext}" required class="form-control" rows="6"></textarea>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn submit-btn rounded-pill px-5 py-3">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </section>
 	
 	
 </main>
</body>
</html>
