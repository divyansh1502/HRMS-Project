<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>

</body>
</html>  <main class="container py-4">
       <section class="container my-4">

    <div class="employee-banner">

        <div class="row align-items-center">

            <!-- Left Side -->

            <div class="col-lg-7">

                <div class="d-flex align-items-center">

                    <div class="banner-icon">

                        <i class="fa-solid fa-users"></i>

                    </div>

                    <div class="ms-3">

                        <h1 class="fw-bold text-white mb-1">
                            Job List
                        </h1>

                       
                    </div>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-5 text-lg-end mt-4 mt-lg-0">

                

                <a href="/user/userdash"
                    class="btn dashboard-btn px-4 py-3 rounded-4">

                    <i class="fa-solid fa-arrow-left me-2"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</section>

        <div th:if="${msg}" class=" text-success py-3 text-center" >
            <span th:text="${msg}"></span>
        </div>

        <section class="container mb-5">

        <div class="table-card">

            <!-- Heading -->

            <div class="d-flex align-items-center mb-4">

                <i class="fa-solid fa-table-list fs-2 me-3 text-dark"></i>

                <h2 class="fw-bold mb-0">
                    Job List
                </h2>

            </div>

            <!-- Table -->

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>NAME</th>
                            <th>GENDER</th>
                            <th>CONTACT</th>
                            <th>EMAIL</th>
                            <th>DEPARTMENT</th>
                            <th>DESIGNATION</th>
                            <th>SALARY</th>
                            <th>ACTION</th>

                        </tr>

                    </thead>

                    <tbody>
                        <tr th:each="j : ${jinfo}">
                            <td th:text="${j.id}"></td>
                            <td class="fw-semibold" th:text="${j.title}"></td>
                            <td th:text="${j.description}"></td>
                            <td th:text="${j.location}"></td>
                            <td th:text="${j.salary}"></td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${j.jobtype}"></span>
                            </td>
                            <td th:text="${j.lastdate}"></td>
                            <td th:text="${j.posteddate}"></td>
                            <td>
                                <a th:href="@{/user/applyjob/{id}(id=${j.id})}">
                                    <button class="btn btn-success btn-sm rounded-pill">Apply</button>
                                </a>
                            </td>
                        </tr>
                       
                    </tbody>

                </table>

            </div>

        </div>

    </section>
    </main>
