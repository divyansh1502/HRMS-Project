<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
	
		<main>
        <section class="container my-4">
            <div class="employee-banner">
                <div class="row align-items-center">
                    <div class="col-lg-7">
                        <div class="d-flex align-items-center">
                            <div class="banner-icon">
                                <i class="fa-solid fa-briefcase"></i>
                            </div>
                            <div class="ms-3">
                                <h1 class="fw-bold text-white mb-1">Post Job Details</h1>
                                <p class="text-white mb-0 opacity-75">Create and publish a new job opening for your organization.</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5 text-lg-end mt-4 mt-lg-0">
                        <a href="#" class="btn dashboard-btn px-4 py-3 rounded-4">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="container mb-5">
            <div class="form-card mx-auto">
                <div class="d-flex align-items-center mb-4">
                    <i class="fa-solid fa-pen-to-square fs-2 me-3 text-primary"></i>
                    <h2 class="fw-bold mb-0">Job Information</h2>
                </div>

                <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    <span th:text="${msg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form class="job-form" method="post" th:object="${jdto}">
                    <div class="row g-4">
                        <div class="col-12">
                            <label for="title" class="form-label">Enter Job Title</label>
                            <div class="form-input-wrapper">
                                
                                <input id="title" type="text" th:field="${jdto.title}" class="form-control" placeholder="Job Title" required />
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label">Enter Description</label>
                            <div class="form-input-wrapper textarea-wrapper">
                                
                                <textarea id="description" th:field="${jdto.description}" class="form-control" placeholder="Describe the job responsibilities, requirements, and benefits" rows="5" required></textarea>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="location" class="form-label">Enter Location</label>
                            <div class="form-input-wrapper">
                                
                                <input id="location" type="text" th:field="${jdto.location}" class="form-control" placeholder="Location" required />
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="salary" class="form-label">Enter Salary</label>
                            <div class="form-input-wrapper">

                                <input id="salary" type="number" th:field="${jdto.salary}" class="form-control" placeholder="Annual salary" required />
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="jobtype" class="form-label">Enter Job Type</label>
                            <div class="form-input-wrapper select-wrapper">

                                <select id="jobtype" class="form-control" th:field="${jdto.jobtype}" required>
                                    <option value="">Select Job Type</option>
                                    <option value="full-time">Full Time</option>
                                    <option value="part-time">Part Time</option>
                                    <option value="internship">Internship</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="lastdate" class="form-label">Enter Last Date</label>
                            <div class="form-input-wrapper">
                                
                                <input id="lastdate" type="date" th:field="${jdto.lastdate}" class="form-control" required />
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-actions">
                                <button type="submit" class="btn submit-btn rounded-pill px-5">
                                    <i class="fa-solid fa-check me-2"></i>Post Job
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
	
</body>
</html>
